apply plugin: 'com.android.application'

android {
    namespace "com.warden.brain"
    compileSdk 34
    defaultConfig {
        applicationId "com.warden.brain"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    // Warden Motion ile aynı imza: köprü sadece aynı imzalı uygulamaya cevap verir
    // Sabit imza anahtarı keystore/ klasöründe durur ve depoya gönderilmez. Yoksa normal hata ayıklama imzası kullanılır.
    def ksProps = new Properties()
    def ksFile = file('../../keystore/keystore.properties')
    if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }
    signingConfigs {
        warden {
            if (ksFile.exists()) {
                storeFile file('../../keystore/' + ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        debug { if (ksFile.exists()) signingConfig signingConfigs.warden }
        release { if (ksFile.exists()) signingConfig signingConfigs.warden; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mediapipe:tasks-genai:0.10.35'
}
