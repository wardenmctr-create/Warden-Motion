<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head><body>
<canvas id="gl" width="480" height="480"></canvas>
<script>window.FXBASE='/native/app/src/main/assets/fx/';</script>
<script src="engine.js"></script>
<script src="subjects.js"></script>
<script src="scenes.js"></script>
<script src="scenes2.js"></script>
<script>
const IMG = {};
function loadImg(k, url) { return new Promise((res) => { const i = new Image(); i.onload = () => { IMG[k] = i; res(); }; i.onerror = () => res(); i.src = url; }); }
async function boot() {
  const f = new FontFace('Inter', 'url(/native/app/src/main/res/font/inter_bold.otf)', { weight: '700' }); await f.load(); document.fonts.add(f);
  const f2 = new FontFace('InterX', 'url(/native/app/src/main/res/font/inter_extrabold.otf)', { weight: '800' }); await f2.load(); document.fonts.add(f2);
  await loadImg('tr', '/public/flags/tr.svg');
  for (const [k, u] of Object.entries(SUBJ.SUBJECT_IMAGES)) await loadImg(k, u);
  for (const k of ['a', 'e', 'h', 'b']) await loadImg('wcb' + k, '/native/app/src/main/res/drawable-nodpi/wcb' + k + '_idle.png');
  window.E = new Engine(document.getElementById('gl'));
  await E.load(window.FXBASE + 'catalog.json');
  window.ready = true;
}
// Bir katmanın kendi düzlemindeki çizimi (pad dahil), s px/birim
function layerCanvas(L, pad, s) {
  const W = Math.ceil((L.w + 2 * pad) * s), H = Math.ceil((L.h + 2 * pad) * s);
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.translate(W / 2, H / 2); g.scale(s, s);
  L.draw(g, L.w, L.h, L);
  return { c, box: [pad * s, pad * s, L.w * s, L.h * s] };
}
// Bir kare: sahne → piksel verisi
const HIST_T = { // History.kt ile aynı sıra (lab için 1/12 sn kare)
  feedbackloop: (v, t) => [...Array(10).keys()].map((k) => t - k / 12), frameshuffle: (v, t) => [t - Math.floor(Math.random() * 6) / 12],
  temporalmedian: (v, t) => [...Array(7).keys()].map((k) => t + (k - 3) / 12), temporaldenoise: (v, t) => [...Array(5).keys()].map((k) => t + (k - 2) / 12),
  brightaccum: (v, t) => [...Array(10).keys()].map((k) => t - k / 12 * 3), darkaccum: (v, t) => [...Array(10).keys()].map((k) => t - k / 12 * 3),
  timemosaic: (v, t) => [...Array(9).keys()].map((k) => t - k * 0.2), timemap: (v, t) => [...Array(9).keys()].map((k) => t + (k - 4) / 4),
  motioncomposite: (v, t, d) => [...Array(8).keys()].map((k) => d * k / 7), temporalfreq: (v, t) => [...Array(10).keys()].map((k) => t - k * 0.1),
  colortrail: (v, t) => [...Array(10).keys()].map((k) => t - k * 0.1), movingmatte: (v, t) => [t, ...[...Array(8).keys()].map((k) => t - (k + 1) * 0.15)],
  motiondirmatte: (v, t) => [t, t - 1 / 12, t + 1 / 12], motionmagnify: (v, t) => [t, t - 1 / 12, t + 1 / 12], framerepair: (v, t) => [t, t - 1 / 12, t + 1 / 12], cinemagraph: (v, t) => [0], stabilize: (v, t) => [Math.max(0, t - 0.6)],
  timediff: (v, t) => [t - Math.max(1 / 12, v.zamanFark ?? 0.1)], medianbg: (v, t, d) => [...Array(10).keys()].map((k) => d * k / 9), flowconfidence: (v, t) => [t, t - 1 / 12, t + 1 / 12], cutbeatpreview: (v, t) => [t, t - 1 / 12], framecheck: (v, t) => [...Array(4).keys()].map((k) => t - k / 12), multitimepanel: (v, t, d) => [...Array(Math.min(16, v.pencere ?? 4)).keys()].map((k, _, a) => d * k / Math.max(1, a.length - 1)), frametimes: (v, t) => [...Array(10).keys()].map((k) => t - k / 12), flowconsistency: (v, t) => [t, t - 1 / 12, t - 2 / 12], loopscanner: (v, t) => [t, ...[...Array(5).keys()].map((k) => t + 0.5 + k * 0.4)], edgeextend2: (v, t) => [...Array(5).keys()].map((k) => t + (k - 2) / 6), stroboscope: (v, t) => [...Array(5).keys()].map((k) => t - k * (v.zamanAral ?? 0.5)), fluidtrail: (v, t) => [...Array(10).keys()].map((k) => t - (v.sonme ?? 1.5) * k / 9), diffmatte: (v, t) => [0], timedisplace: (v, t) => [...Array(10).keys()].map((k) => t - (v.maksimumZama ?? 0.5) * k / 9),
};
async function frame(scene, p) {
  const gl = E.gl, S = scene.size, s = 480 / S, t = p * scene.dur; window.PHASE = p;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, 480, 480);
  gl.disable(gl.BLEND); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  // arka plan
  const bg = document.createElement('canvas'); bg.width = bg.height = 480; const bgx = bg.getContext('2d'); bgx.scale(s, s); scene.bg(bgx, S, p);
  const bgt = E.upload(bg); gl.disable(gl.BLEND); await E.pass('_comp', null, { u_tex: bgt }, { u_op: 1 }, [2, 0, 0, 0, -2, 0, -1, 1, 1]); E.free(bgt);
  for (const L0 of scene.layers) {
    const L = typeof L0 === 'function' ? L0(p) : L0;
    const fx = (L.fx || []).map((e) => ({ type: e.type, v: typeof e.v === 'function' ? e.v(p, t) : (e.v || {}) }));
    let pad = L.pad ?? 0;
    for (const e of fx) { const m = E.meta[e.type]; if (m && m.pad) pad += linearOf(m.pad, typeof e.v === 'function' ? e.v(p, t) : e.v, m, L); }
    const lc = layerCanvas(L, pad, s);
    const base = E.upload(lc.c);
    const extra = {}; if (L.depth) extra.u_depth = E.upload(layerCanvas({ ...L, draw: L.depth }, pad, s).c);
    // Zamansal efektler: katmanın başka anlardaki görüntüsünden kare şeridi (motordaki History.kt ile aynı sıra, yaklaşık)
    const hfx = fx.find((e) => HIST_T[e.type]);
    if (hfx) { const ts = HIST_T[hfx.type](hfx.v, t, scene.dur); const n = ts.length; const one = layerCanvas(L, pad, s).c; const st = document.createElement('canvas'); st.width = one.width * n; st.height = one.height; const sg = st.getContext('2d');
      const tr0 = L.tr ? L.tr(p, t) : {}; const keep = window.PHASE;
      ts.forEach((tt, i) => { const pp = ((tt / scene.dur) % 1 + 1) % 1; window.PHASE = pp; const fr = layerCanvas(L, pad, s).c; const tr1 = L.tr ? L.tr(pp, pp * scene.dur) : {};
        sg.save(); sg.beginPath(); sg.rect(i * one.width, 0, one.width, one.height); sg.clip(); sg.translate(i * one.width + one.width / 2 + ((tr1.x ?? 0) - (tr0.x ?? 0)) * s, one.height / 2 + ((tr1.y ?? 0) - (tr0.y ?? 0)) * s);
        sg.rotate(((tr1.rot ?? 0) - (tr0.rot ?? 0)) * Math.PI / 180); sg.drawImage(fr, -one.width / 2, -one.height / 2); sg.restore(); });
      window.PHASE = keep; extra.s_hist = E.upload(st); }
    window.CUR_ROT = L.tr ? (L.tr(p, t).rot || 0) : 0;
    const out = await applyEffects(E, base, lc.box, s, fx, t, scene.dur, extra);
    if (extra.u_depth) E.free(extra.u_depth); if (extra.s_hist) E.free(extra.s_hist);
    // sahneye: merkez (x,y), dönme, ölçek
    const tr = L.tr ? L.tr(p, t) : {};
    const x = (tr.x ?? L.x) * s, y = (tr.y ?? L.y) * s, rot = (tr.rot ?? 0) * Math.PI / 180, sc = tr.scale ?? 1, op = tr.op ?? 1;
    const hw = out.w / 2 * sc, hh = out.h / 2 * sc, ca = Math.cos(rot), sa = Math.sin(rot);
    // birim kare (0..1) → piksel → NDC (y aşağı)
    const ax = 2 / 480, ay = -2 / 480;
    const m = [ (2 * hw * ca) * ax, (2 * hw * sa) * ay, 0, (-2 * hh * sa) * ax, (2 * hh * ca) * ay, 0,
      (x - hw * ca + hh * sa) * ax - 1, (y - hw * sa - hh * ca) * ay + 1, 1 ];
    const mbE = fx.find((e) => e.type === 'motionblur');
    if (mbE && L.tr) {
      const N = 14, span = (mbE.v.tune ?? 1) / 20; const acc = E.tex(480, 480);
      gl.bindFramebuffer(gl.FRAMEBUFFER, acc.fb); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
      for (let i = 0; i < N; i++) { const tt = t + span * (i / (N - 1) - 0.5); const r2 = L.tr(tt / scene.dur, tt);
        const X = (r2.x ?? L.x) * s, Y = (r2.y ?? L.y) * s, ro = (r2.rot ?? 0) * Math.PI / 180, sc2 = r2.scale ?? 1; const hw2 = out.w / 2 * sc2, hh2 = out.h / 2 * sc2, c2 = Math.cos(ro), s2 = Math.sin(ro);
        const m2 = [(2 * hw2 * c2) * ax, (2 * hw2 * s2) * ay, 0, (-2 * hh2 * s2) * ax, (2 * hh2 * c2) * ay, 0, (X - hw2 * c2 + hh2 * s2) * ax - 1, (Y - hw2 * s2 - hh2 * c2) * ay + 1, 1];
        m2[7] = -m2[7]; m2[4] = -m2[4]; m2[1] = -m2[1];
        await E.pass('_comp', acc, { u_tex: out }, { u_op: op / N }, m2); }
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      await E.pass('_comp', null, { u_tex: acc }, { u_op: 1 }, [2, 0, 0, 0, -2, 0, -1, 1, 1]); E.free(acc);
    } else {
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    await E.pass('_comp', null, { u_tex: out }, { u_op: op }, m);
    }
    if (out !== base) E.free(out); E.free(base);
  }
  gl.disable(gl.BLEND);
  return document.getElementById('gl').toDataURL('image/png');
}
async function render(name) { const sc = (E.meta[name] && E.meta[name].ready) ? autoScene(name) : (SCENES[name] || window.TEST_SCENES?.[name] || autoScene(name)); const n = Math.round(sc.dur * sc.fps); const out = []; for (let i = 0; i < n; i++) out.push(await frame(sc, i / n)); return out; }
boot().catch((e) => { window.bootErr = String(e); });
</script></body></html>
